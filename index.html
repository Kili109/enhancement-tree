<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Enhancement Tree</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0c0c0e;
    color: #ddd;
    font-family: system-ui, sans-serif;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  h1 { font-size: 15px; font-weight: 500; color: #999; margin-bottom: 8px; letter-spacing: 1px; }
  .points { font-size: 13px; color: #888; margin-bottom: 14px; }
  .tree {
    background: #121214;
    border: 1px solid #2a2a2e;
    border-radius: 6px;
    padding: 16px 12px 8px;
  }
  .row {
    display: grid;
    grid-template-columns: repeat(4, 58px);
    gap: 8px 14px;
    margin-bottom: 22px;
    justify-content: center;
  }
  .talent {
    width: 54px;
    height: 54px;
    background: #1c1c20;
    border: 2px solid #3a3a42;
    border-radius: 3px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 9px;
    text-align: center;
    line-height: 1.15;
    color: #ccc;
    position: relative;
    cursor: pointer;
    user-select: none;
  }
  .talent.maxed { border-color: #3d7a3d; background: #121a12; box-shadow: 0 0 0 1px #3d7a3d inset; }
  .talent.partial { border-color: #c9a227; background: #1e1a10; }
  .talent.locked { opacity: 0.4; cursor: not-allowed; }
  .ranks { font-size: 9px; color: #888; margin-top: 2px; }
  .arrow {
    position: absolute;
    top: 54px;
    left: 50%;
    width: 2px;
    background: #777;
    transform: translateX(-50%);
    pointer-events: none;
  }
  .arrow::after {
    content: '';
    position: absolute;
    bottom: -4px;
    left: -3px;
    border: 4px solid transparent;
    border-top-color: #777;
  }
  .arrow.s { height: 22px; }
  .arrow.m { height: 98px; }
  .arrow.l { height: 174px; }
  .empty { visibility: hidden; }
  .tooltip {
    position: absolute;
    background: #1a1a1e;
    border: 1px solid #3a3a42;
    color: #ccc;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 4px;
    max-width: 200px;
    z-index: 10;
    pointer-events: none;
    display: none;
  }
    margin-top: 10px;
    font-size: 11px;
    color: #666;
    display: flex;
    gap: 12px;
  }
  .legend i {
    display: inline-block;
    width: 9px; height: 9px;
    border: 2px solid;
    border-radius: 2px;
    margin-right: 3px;
    vertical-align: -1px;
  }
  .n { border-color: #2e7a2e; background: #101810; }
  .m { border-color: #2a5a9a; }
  .c { border-color: #9a5a2a; }
  button {
    margin-top: 12px;
    background: #1c1c20;
    color: #aaa;
    border: 1px solid #3a3a42;
    padding: 6px 12px;
    border-radius: 4px;
    cursor: pointer;
    font-size: 12px;
  }
  button:hover { border-color: #5a5a66; }
  .tooltip {
    position: absolute;
    background: #1a1a1e;
    border: 1px solid #3a3a42;
    color: #ccc;
    font-size: 11px;
    padding: 6px 8px;
    border-radius: 4px;
    max-width: 220px;
    z-index: 10;
    pointer-events: none;
    display: none;
  }
</style>
</head>
<body>
  <h1>ENHANCEMENT</h1>
  <div class="points">Points spent: <span id="spent">0</span> / 51</div>
  <div class="tree" id="tree"></div>
  <div class="tooltip" id="tip"></div>
  <button onclick="reset()">Reset</button>

<script>
const talents = [
  [1,0,"Earth's\nGrasp",2,"moved"],
  [1,1,"Thund.\nStrikes",5,"moved"],
  [1,2,"Ancest.\nKnow.",5,""],
  [1,3,"Guard.\nTotems",2,"moved"],
  [2,0,"Elem.\nWeapons",3,"moved"],
  [2,1,"Mental\nDexterity",3,"","Flurry"],
  [2,2,"Imp.\nGhost Wolf",2,""],
  [2,3,"Imp.\nShields",3,"changed","Elemental Shield"],
  [3,0,"Earth\nBorne",5,"new","Tectonic"],
  [3,2,"Sham.\nFocus",1,""],
  [3,3,"Elemental\nShield",1,"new"],
  [4,1,"Flurry",5,""],
  [4,2,"Zephyr",3,"changed"],
  [4,3,"Storm\nstrike",1,"","Imp Stormst"],
  [5,1,"Spirit\nWeapons",1,""],
  [5,2,"Mental\nQuickness",2,"","Rage of Farseer"],
  [5,3,"Imp\nStormst",2,""],
  [6,0,"Tectonic",1,"new"],
  [6,3,"Maelstrom\nWeapon",5,""],
  [7,2,"Rage of\nFarseer",1,""],
];

const tooltips = {
  "Guard Totems": "Increases the amount of damage reduced by your Stoneskin Totem and Windwall Totem by 10% per rank and reduces the cooldown of your Grounding Totem by 1 sec per rank.",
  "Guard. Totems": "Increases the amount of damage reduced by your Stoneskin Totem and Windwall Totem by 10% per rank and reduces the cooldown of your Grounding Totem by 1 sec per rank.",
  "Earth's Grasp": "Increases the health of your Stoneclaw Totem by 25% and the radius of your Earthbind Totem by 10% per rank.",
  "Thund. Strikes": "Increases your chance to get a critical strike with all spells and attacks by 1% per rank.",
  "Ancest. Know.": "Increases your Intellect by 2% per rank.",
  "Mental Dexterity": "Increases your Attack Power by 33/66/100% of your Intellect.",
  "Elem. Weapons": "Increases the melee attack power bonus of Rockbiter Weapon by 7/13/20%, the effect of Windfury Weapon by 13/27/40%, and the damage of Flametongue and Frostbrand Weapon by 5/10/15%.",
  "Imp. Ghost Wolf": "Rank 1 reduces the cast time of Ghost Wolf by 1 sec and allows it to be used indoors. Rank 2 makes it instant.",
  "Imp. Shields": "Increases the effectiveness of your shields by 5% per rank.",
  "Earth Borne": "Increases your chance to block by 1% and the amount blocked by 5% per rank.",
  "Sham. Focus": "Reduces the mana cost of your Shock spells and Lightning Shield by 45%.",
  "Elemental Shield": "Three charges. Reflects a flat amount of Fire, Frost or Nature damage back at the caster.",
  "Flurry": "Increases your attack speed by 5/10/15/20/25% for your next 3 swings after dealing a melee critical strike.",
  "Zephyr": "Increases your chance to parry by 1% and dodge by 1% per rank.",
  "Storm strike": "Instantly strikes the target, dealing weapon damage. Your next Nature spell deals 20% increased damage.",
  "Spirit Weapons": "Reduces all threat generated by your melee attacks by 30% while Rockbiter is not active, and increases it by 30% while Rockbiter is active.",
  "Mental Quickness": "Increases your spell damage and healing by up to 15/30% of your Intellect.",
  "Imp Stormst": "When you Stormstrike, you have a 50/100% chance to gain 50% mana regeneration while casting spells for 15 sec, and Stormstrike's cooldown has a 50/100% chance to reset each time you Dodge or Parry.",
  "Tectonic": "If you are critically hit or crushing-blowed for more than 25% of your maximum health, you cannot be critically hit or crushing-blowed again for 3 seconds. This effect cannot occur more than once every 20 seconds.",
  "Maelstrom Weapon": "When you deal damage with a melee attack, you have a chance to reduce the cast time and Mana cost of your next Lightning Bolt by 4/8/12/16/20%. Stacks up to 5 times. Lasts 30 sec.",
  "Rage of Farseer": "Increases your attack speed by 30% for 25 seconds."
};

const state = {};
talents.forEach(t => state[t[1]+","+t[0]] = 0); // col,row -> rank

function canSpend(row, col) {
  const t = talents.find(x => x[0]===row && x[1]===col);
  if (!t) return false;
  const [r, c, name, max, type, prereqName] = t;
  const key = c+","+r;
  if ((state[key]||0) >= max) return false;

  // Unlock row N once you have spent at least 5*(N-1) points total
  if (r > 1) {
    let total = 0;
    talents.forEach(tt => { if (tt[0] < r) total += state[tt[1]+","+tt[0]]||0; });
    if (total < 5 * (r-1)) return false;
  }

  // If any talent points an arrow at this one, that talent must be maxed
  const clean = s => (s||"").replace(/[\n\-.]/g," ").replace(/\s+/g," ").trim().toLowerCase();
  const myName = clean(name);
  const blocker = talents.find(x => {
    if (!x[5]) return false;
    return clean(x[5]) === myName;
  });
  if (blocker) {
    const bKey = blocker[1]+","+blocker[0];
    if ((state[bKey]||0) < blocker[3]) return false;
  }
  return true;
}

function render() {
  const tree = document.getElementById("tree");
  tree.innerHTML = "";
  for (let r = 1; r <= 7; r++) {
    const row = document.createElement("div");
    row.className = "row";
    for (let c = 0; c < 4; c++) {
      const t = talents.find(x => x[0]===r && x[1]===c);
      if (!t) {
        const e = document.createElement("div");
        e.className = "empty";
        row.appendChild(e);
        continue;
      }
      const [rowN, col, name, max, type, prereq] = t;
      const key = col+","+rowN;
      const rank = state[key] || 0;
      const div = document.createElement("div");
      const locked = !canSpend(rowN, col) && rank === 0;
      let cls = "talent";
      if (type) cls += " " + type;
      if (rank > 0 && rank < max) cls += " partial";
      if (rank === max) cls += " maxed";
      if (locked) cls += " locked";
      div.className = cls;
      div.innerHTML = name.replace("\n","<br>") + `<div class="ranks">${rank}/${max}</div>`;
      if (prereq) {
        const arrow = document.createElement("div");
        const p = prereq.toLowerCase();
        const cls = p.includes("tectonic") ? "l" : p.includes("farseer") ? "m" : p.includes("flurry") ? "m" : "s";
        arrow.className = "arrow " + cls;
        div.appendChild(arrow);
      }
      const cleanName = name.replace(/\n/g," ").replace(/-/g,"");
      div.title = "";
      div.onmouseenter = (e) => {
        const tip = document.getElementById("tip");
        tip.textContent = tooltips[cleanName] || tooltips[name.replace(/\n/g," ").replace(/\./g,"")] || tooltips[name.replace(/\n/g," ")] || "";
        if (tip.textContent) {
          tip.style.display = "block";
          tip.style.left = (e.pageX + 12) + "px";
          tip.style.top = (e.pageY + 12) + "px";
        }
      };
      div.onmousemove = (e) => {
        const tip = document.getElementById("tip");
        tip.style.left = (e.pageX + 12) + "px";
        tip.style.top = (e.pageY + 12) + "px";
      };
      div.onmouseleave = () => { document.getElementById("tip").style.display = "none"; };
      div.onclick = (e) => {
        if (e.shiftKey || e.button===2) {
          if (canRemove(rowN, col)) state[key]--;
        } else {
          if (canSpend(rowN, col)) state[key]++;
        }
        update();
      };
      div.oncontextmenu = (e) => { e.preventDefault(); if (canRemove(rowN, col)) { state[key]--; update(); } };
      row.appendChild(div);
    }
    tree.appendChild(row);
  }
}

// Dismiss tooltip on tap/click anywhere else
document.addEventListener("click", (e) => {
  if (!e.target.closest(".talent")) {
    document.getElementById("tip").style.display = "none";
  }
});
document.addEventListener("touchstart", (e) => {
  if (!e.target.closest(".talent")) {
    document.getElementById("tip").style.display = "none";
  }
}, { passive: true });

function canRemove(row, col) {
  const key = col+","+row;
  if ((state[key]||0) <= 0) return false;

  state[key]--;
  let blocked = false;
  for (let r = row+1; r <= 7; r++) {
    let laterPoints = 0;
    talents.forEach(tt => { if (tt[0] === r) laterPoints += state[tt[1]+","+tt[0]]||0; });
    if (laterPoints > 0) {
      let prior = 0;
      talents.forEach(tt => { if (tt[0] < r) prior += state[tt[1]+","+tt[0]]||0; });
      if (prior < 5 * (r-1)) { blocked = true; break; }
    }
  }
  state[key]++;
  return !blocked;
}

function update() {
  let spent = 0;
  talents.forEach(t => {
    const key = t[1]+","+t[0];
    spent += state[key] || 0;
  });
  document.getElementById("spent").textContent = spent;
  render();
}

function reset() {
  talents.forEach(t => state[t[1]+","+t[0]] = 0);
  update();
}

update();
</script>
</body>
</html>
